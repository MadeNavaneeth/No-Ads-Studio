// D35: standalone minesweeper(9) app — app module.
//
// Depends on the shared shell (chrome) and design-system (design language) via
// composite builds. This module provides only the nonogram game code, its session
// persistence, and the app entry point.
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.lightapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.noadsstudio.minesweeper"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        ignoreTestSources = true
        abortOnError = false
    }
}

dependencies {
    // The shared shell — chrome, navigation, settings, stats. Composite-substituted.
    implementation 'com.example.lightapp:shell'

    // Compose — the game screens use foundation layout directly.
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.activity.compose

    // Persistence — decision D7. DataStore, not Room.
    implementation libs.datastore.preferences

    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose

    testImplementation libs.junit
}

// The conformance checker is a build gate, not an optional step — decisions D23 and D37.
tasks.named('check') { dependsOn gradle.includedBuild('conformance').task(':conformanceCheck') }

// Lint disable must live in the module script: :app tasks are not visible from the
// root project of this build. Same JDK 25 reason (D22/D24).
tasks.matching { it.name.startsWith('lint') }.configureEach { enabled = false }
