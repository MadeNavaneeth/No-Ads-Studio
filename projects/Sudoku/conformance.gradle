// ═══════════════════════════════════════════════════════════════════════════════
// CONFORMANCE CHECKER
//
// The static half of the enforcement ladder. Bound to `check`, so it is a build
// gate rather than a step someone remembers to run.
//
// Deliberately zero-dependency — decision D23. Requirement 15 and decision D9
// named detekt and Konsist. Both would mean a plugin, and a custom detekt rule
// additionally means a separate module compiled against detekt-api, for what is
// ultimately a handful of source patterns. `avoid.md` bars heavy dependencies and
// build cost on the reference machine is a stated constraint, so this does the
// same work with nothing added.
//
// What it cannot do that an AST tool could: understand scope. It matches text. So
// it is deliberately conservative — every rule here is one where a textual match
// is unambiguous.
// ═══════════════════════════════════════════════════════════════════════════════

def SUPPRESSION = '@DesignSuppression'

/** Requirement 15 criterion 15. Ten is enough to be pragmatic and few enough to audit. */
def SUPPRESSION_CAP = 10

/**
 * One rule: a name, the files it applies to, a pattern, why it exists, and — the part that
 * matters most for a small model — the literal remedy.
 *
 * [fix] is printed on every violation. The difference it makes: a capable model can read the
 * `authority` column, open that document, and work out what to do. A small model cannot
 * reliably do that chain, but it *can* act on "you wrote `16.dp`, write `NothingSpacing.md`".
 * So the checker stopped being a critic and became an instruction: every failure now carries
 * the edit that resolves it.
 */
class ConformanceRule {
    String id
    String description
    String authority
    List<File> roots
    String pattern
    String fix = ''
    Closure<Boolean> exempt = { File f, String line -> false }
}

def ktFiles = { File root ->
    if (!root.exists()) return []
    def out = []
    root.eachFileRecurse { f -> if (f.name.endsWith('.kt')) out << f }
    return out
}

/**
 * A file's text with comments removed.
 *
 * Every line-based rule already strips comments before matching, because each of these rules
 * is about what the compiler sees. Any rule that inspects whole-file text has to do the same
 * or it disagrees with its own siblings — `D13-three-readouts` counted occurrences in raw text
 * and was tripped by a doc comment *documenting the rule*, which is a memorable way to learn
 * that a check is measuring prose.
 */
def codeText = { File f ->
    f.readLines()
            .collect { it.replaceAll(/\/\/.*$/, '').replaceAll(/^\s*\*.*$/, '') }
            .join('\n')
}

tasks.register('conformanceCheck') {
    group = 'verification'
    description = 'Verifies the design-system rules that can be checked statically'

    doLast {
        // Fast mode: skip only the one check that needs a prior `assembleDebug` — the
        // merged-manifest permission scan. Everything else is pure source and file inspection
        // that runs in a second or two on a warm daemon.
        //
        // This exists so an automatic hook can run the checker on every stop without forcing
        // a full build first. `./gradlew conformanceCheck -Pconformance.fast=true`. The full
        // `check` still runs everything, so nothing is permanently skipped — fast mode is a
        // quicker inner loop, not a weaker gate.
        def fast = project.hasProperty('conformance.fast')

        // Every app source set, not just `main`.
        //
        // This was hardcoded to `app/src/main/java`. The moment the app grew product
        // flavours and the games moved into flavour-scoped source sets, every source rule
        // silently stopped seeing any game code at all — still reporting PASS, now for the
        // reason that it was looking at almost nothing. Discovered rather than listed, so a
        // new flavour or a new game directory is covered without editing this file.
        def appSrc = file('app/src')
        def appSources = (appSrc.listFiles() ?: [] as File[])
                .findAll { it.isDirectory() && !(it.name in ['test', 'androidTest']) }
                .collect { new File(it, 'java') }
                .findAll { it.exists() }
                .sort { it.path }

        if (appSources.isEmpty()) {
            throw new GradleException(
                    'Conformance check found no app source directories under app/src. ' +
                            'Every source rule would vacuously pass, so this fails instead.')
        }

        def dsMain = file('design-system/src/main/java')
        def dsComponents = file('design-system/src/main/java/com/example/lightapp/designsystem/components')
        def dsTheme = file('design-system/src/main/java/com/example/lightapp/designsystem/theme')

        def rules = [
                new ConformanceRule(
                        id: 'R15-literals-consumer',
                        description: 'No colour, dp, or sp literal in a consumer module',
                        authority: 'Requirement 15 criteria 3 and 10',
                        roots: appSources,
                        pattern: /(\b\d+(\.\d+)?\.dp\b|\b\d+(\.\d+)?\.sp\b|Color\(0x)/,
                        fix: 'Replace the literal with a token. A dp value becomes a NothingSpacing ' +
                                'step (16.dp -> NothingSpacing.md, applied via Modifier.pad/sizeOf); a ' +
                                'colour becomes a TextRole/SurfaceRole/BorderRole. Sizes: 4=xs 8=sm ' +
                                '16=md 24=lg 32=xl 48=xxl 64=xxxl 96=hero. See design-canon/nothing-tokens.md.',
                ),
                new ConformanceRule(
                        id: 'R15-forbidden-types',
                        description: 'A consumer module may not import Color, Dp, or TextUnit',
                        authority: 'Requirement 15 criteria 2 and 3',
                        roots: appSources,
                        pattern: /^import androidx\.compose\.ui\.(graphics\.Color|unit\.Dp|unit\.TextUnit)$/,
                        fix: 'Delete this import. Name a role instead of the raw type: TextRole for text ' +
                                'colour, SurfaceRole for backgrounds, a NothingSpacing step for a Dp. If ' +
                                'you truly need a packed colour int (e.g. system bars), use a plain Int ' +
                                'constant as MainActivity does.',
                ),
                new ConformanceRule(
                        id: 'R15-literals-components',
                        description: 'No colour, dp, or sp literal outside the theme package',
                        authority: 'Requirement 15 criteria 9 to 11',
                        roots: [dsComponents],
                        pattern: /(\b\d+(\.\d+)?\.dp\b|\b\d+(\.\d+)?\.sp\b|Color\(0x)/,
                        fix: 'A component reads values from NothingTheme/NothingSpacing, never as ' +
                                'literals. If a needed value has no token, add the token to ' +
                                'design-canon/tokens.json first — do not inline it here.',
                ),
                new ConformanceRule(
                        id: 'R8-bare-material-theme',
                        description: 'MaterialTheme may only be called from the theme package',
                        authority: 'Requirement 8 criterion 6',
                        roots: appSources + [dsComponents],
                        pattern: /MaterialTheme\s*\(/,
                        fix: 'Wrap content in NothingTheme { }, not MaterialTheme { }. NothingTheme.kt is ' +
                                'the one place MaterialTheme may be called; it populates Material from our tokens.',
                ),
                new ConformanceRule(
                        id: 'R13-forbidden-motion',
                        description: 'No spring, bounce, overshoot, or position/scale animation',
                        authority: 'Requirement 13 criteria 3 and 4',
                        roots: appSources + [dsMain],
                        pattern: /(\bspring\s*\(|Overshoot|Bounce|animateDpAsState|\.graphicsLayer\s*\{)/,
                        fix: 'Animate opacity or colour only. Use animateColorAsState/animateFloatAsState ' +
                                'with NothingMotion.microSpec() or transitionSpec(); never animate position, ' +
                                'size, or scale, and never a spring. For screen changes use Crossfade.',
                ),
                new ConformanceRule(
                        id: 'R11-no-dividers',
                        description: 'Groups are separated by spacing, never by a divider line',
                        authority: 'Requirement 11 criterion 8',
                        roots: appSources + [dsMain],
                        pattern: /\b(Divider|HorizontalDivider|VerticalDivider)\s*\(/,
                        fix: 'Delete the divider. Separate the groups with NothingSpacing.xl (32dp) or ' +
                                'larger via NothingArrangement.spacedBy or a pad() — space replaces the line.',
                ),
                new ConformanceRule(
                        id: 'R8-no-elevation',
                        description: 'Elevation is surface colour only — no shadow, blur, or gradient',
                        authority: 'Requirement 8 criteria 3 and 4',
                        roots: appSources + [dsMain],
                        pattern: /(\.shadow\s*\(|\.blur\s*\(|Brush\.(linear|radial|vertical|horizontal)Gradient)/,
                        fix: 'Remove the shadow/blur/gradient. Show elevation by moving up a surface ' +
                                'role instead: SurfaceRole.Surface -> SurfaceRaised. Flat fills only.',
                ),
                new ConformanceRule(
                        id: 'R9-proprietary-fonts',
                        description: 'Nothing\'s proprietary faces must never be referenced',
                        authority: 'Requirement 9 criterion 3, decision D11',
                        roots: appSources + [dsMain],
                        pattern: /(ndot5[57]|ntype82)/,
                        fix: 'Never reference NDot or NType — they are not openly licensed. Use the three ' +
                                'font roles (display/sans/mono) resolved in Fonts.kt.',
                ),

                // ── The rules below exist because a review obligation is not a rule ──
                //
                // Every one of these encodes a defect that was actually found in
                // `sudoku(9)` and fixed. They are the failures this architecture invites,
                // so they are the ones worth spending a gate on: an agent working from the
                // canon cannot be relied on to remember a prose instruction, but it cannot
                // ship a failing build either.

                new ConformanceRule(
                        id: 'D15-gated-haptics',
                        description: 'Haptics go through the gated channel, never the platform API',
                        authority: 'Decision D15',
                        roots: appSources + [dsComponents],
                        // Decision D15 makes haptics the primary feedback channel, which makes
                        // the "haptics off" setting load-bearing. A component that reaches for
                        // LocalHapticFeedback itself cannot be switched off — and three of them
                        // did, so the persisted setting was rendered in Settings and honoured
                        // nowhere. Use rememberNothingHaptics(); only Haptics.kt may hold the
                        // platform handle.
                        pattern: /LocalHapticFeedback/,
                        fix: 'Replace with val haptics = rememberNothingHaptics(), then ' +
                                'haptics.perform(HapticEvent.Tick / Conflict / Complete). Only Haptics.kt ' +
                                'in the theme package may touch LocalHapticFeedback, so the off switch works.',
                ),
                new ConformanceRule(
                        id: 'R16-no-raw-concurrency',
                        description: 'Concurrency is structured — no raw threads, GlobalScope, or runBlocking',
                        authority: 'Requirement 16 criterion 3',
                        roots: appSources,
                        // A raw thread cannot be cancelled by the ViewModel that started it.
                        // The vendored generator is exempt because it *is* raw threads; that is
                        // precisely why it needed an explicit abort() flag to become
                        // cancellable at all. New code has coroutines and no such excuse.
                        pattern: /(\bThread\s*\(|\bGlobalScope\b|\brunBlocking\s*\()/,
                        exempt: { File f, String line -> f.path.contains('/sudoku/core/') },
                ),
                new ConformanceRule(
                        id: 'R16-no-unsafe-unwrap',
                        description: 'No non-null assertion outside vendored code',
                        authority: 'Requirement 16',
                        roots: appSources,
                        // `!!` is how a null becomes a crash on a user's device instead of a
                        // compile error on ours. The vendored engine is full of them and is
                        // exempt; nothing we write needs one.
                        pattern: /!!/,
                        fix: 'Replace !! with a safe form: `?: return`, `?.let { }`, or ' +
                                'requireNotNull(x) { "why" } if it genuinely cannot be null. !! ships a ' +
                                'crash to the device instead of failing on your machine.',
                        exempt: { File f, String line -> f.path.contains('/sudoku/core/') },
                ),
                new ConformanceRule(
                        id: 'G1-dots-carry-information',
                        description: 'A dot matrix must be bound to a quantity, never a constant',
                        authority: 'Requirement 12, decision D12, nothing-study.md §3',
                        roots: appSources,
                        // Rule G1 is the one most likely to be broken by accident, because a
                        // dot grid is attractive and cheap. Passing a literal turns the readout
                        // into wallpaper, which nothing-study.md §3 identifies as the single
                        // clearest tell of a copy. Matches `progress = 0f` or `= 1f` only when
                        // the literal is the whole argument, so a `?: 0f` fallback still passes.
                        pattern: /progress\s*=\s*[01](\.0+)?f\s*[,)]/,
                        fix: 'Bind progress to a real 0..1 quantity, e.g. state.completion. A constant ' +
                                'makes the dot matrix decoration, which G1 forbids. A `... ?: 0f` fallback ' +
                                'for an absent state is fine and does not trip this.',
                ),
                new ConformanceRule(
                        id: 'R16-screen-fits-the-window',
                        description: 'Every screen handles window insets and can scroll',
                        authority: 'Requirement 16, targetSdk 35 edge-to-edge enforcement',
                        roots: appSources,
                        // Inverted: this fires on a *Screen.kt that is MISSING the two things
                        // every screen needs. Under targetSdk 35 Android 15 draws behind the
                        // system bars whether the app asked to or not, so a screen without
                        // safeDrawing puts its top bar under the status bar and its controls
                        // under the navigation bar. Without a scroll, a board that is as tall
                        // as it is wide clips its own controls off the bottom of a short phone.
                        // Both shipped that way.
                        pattern: /^@Composable$/,
                        exempt: { File f, String line ->
                            // Matched with the trailing paren so these can only be call sites.
                            // Testing for the bare symbol passed on a file that imported
                            // `safeDrawing` and never applied it, which is exactly the mistake
                            // the rule is meant to catch.
                            if (!f.name.endsWith('Screen.kt')) return true
                            def code = codeText(f)
                            code.contains('windowInsetsPadding(') && code.contains('verticalScroll(')
                        },
                        fix: 'Add both to the screen root Column: ' +
                                '.windowInsetsPadding(WindowInsets.safeDrawing) so content clears the ' +
                                'system bars, and .verticalScroll(rememberScrollState()) so it fits a ' +
                                'short screen. Copy the pattern from game-scaffold.md section 4.',
                ),
                new ConformanceRule(
                        id: 'D13-three-readouts',
                        description: 'At most three readouts on a game screen',
                        authority: 'Decision D13, nothing-study.md §11',
                        roots: appSources,
                        // "Expose the mechanism" does not license dumping state into the UI.
                        // iFixit's charge against Nothing is that visible internals do not
                        // actually help you; the answer is a composed view, not a debug
                        // overlay. Three chosen well beat twelve dumped honestly. Fires on the
                        // fourth `Readout("…")` call in a single file.
                        pattern: /^@Composable$/,
                        exempt: { File f, String line ->
                            (codeText(f) =~ /\bReadout\s*\(\s*"/).count <= 3
                        },
                        fix: 'A game screen shows exactly three readouts (D13). Remove one Readout("...") ' +
                                'call. If this is not a game screen, name its helper something other than ' +
                                'Readout — StatsScreen uses StatLine for the same reason.',
                ),
        ]

        // ── structural checks: the harness and the anti-requirements ──────────
        // These are not source patterns, so they run separately and report into the
        // same list. Requirements 1, 4, 5, and 17.
        def structural = []
        def workspace = rootProject.file('../..')
        def canon = new File(workspace, 'design-canon')

        def note = { String id, String detail, String authority ->
            structural << [id: id, detail: detail, authority: authority]
        }

        // R1: the four harness directories, and root markdown limited to three names.
        ['ideas', 'design-canon', 'projects', 'specs'].each { dir ->
            if (!new File(workspace, dir).isDirectory()) {
                note('R1-harness-dirs', "missing harness directory: $dir", 'Requirement 1 criterion 1')
            }
        }
        workspace.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.md') &&
                    !(f.name in ['README.md', 'AGENTS.md', 'CLAUDE.md'])) {
                note('R1-root-markdown', "unexpected root markdown: ${f.name}",
                        'Requirement 1 criteria 2 and 9')
            }
        }

        // R17: agent adapters must be symlinks to AGENTS.md, never copies.
        ['CLAUDE.md', '.github/copilot-instructions.md'].each { rel ->
            def link = new File(workspace, rel)
            if (!link.exists()) {
                note('R17-adapter-links', "missing agent adapter: $rel",
                        'Requirement 17 criterion 4')
            } else if (!java.nio.file.Files.isSymbolicLink(link.toPath())) {
                note('R17-adapter-links', "$rel is a regular file, must be a symlink",
                        'Requirement 17 criteria 4 and 5')
            }
        }

        // R4 criteria 2 and 6: zero permissions, and no deprecated `package` attribute.
        //
        // Every manifest in every source set, not just src/main. A flavour that adds its own
        // manifest — the documented way to declare flavour-scoped components — would otherwise
        // be exactly the file this check never read. Globbed rather than enumerated so a new
        // game flavour is covered without editing this file.
        ['app', 'design-system'].each { module ->
            def srcRoot = file("$module/src")
            if (!srcRoot.exists()) return
            def manifests = []
            srcRoot.eachFileRecurse { f ->
                if (f.isFile() && f.name == 'AndroidManifest.xml') manifests << f
            }
            manifests.each { manifest ->
                def rel = rootProject.relativePath(manifest).replace(File.separator, '/')
                def text = manifest.text
                (text =~ /uses-permission[^>]*android:name="([^"]+)"/).each { m ->
                    note('R4-zero-permissions', "$rel declares permission ${m[1]}",
                            'Requirement 4 criterion 2')
                }
                if (text =~ /<manifest[^>]*\spackage\s*=/) {
                    note('R4-no-package-attr', "$rel uses the deprecated package attribute",
                            'Requirement 4 criterion 6')
                }
            }
        }

        // R4: every <application> element pins allowBackup="false".
        //
        // The attribute defaults to TRUE when absent, so silence is the unsafe state: with it
        // on, device transfer / `adb backup` can lift the app's private DataStore — saved
        // sessions and stats — off the device. Everything the app knows about a player must
        // stay on the player's device; this is the one manifest-level export path, so it is
        // closed here and checked here.
        ['app', 'design-system'].each { module ->
            def srcRoot = file("$module/src")
            if (!srcRoot.exists()) return
            srcRoot.eachFileRecurse { f ->
                if (!f.isFile() || f.name != 'AndroidManifest.xml') return
                def text = f.text
                if (!(text =~ /<application\b/)) return
                if (!(text =~ /android:allowBackup\s*=\s*"false"/)) {
                    note('R4-allow-backup',
                            "${rootProject.relativePath(f)} does not pin " +
                                    'android:allowBackup="false" (absent defaults to true)',
                            'Requirement 4 criterion 2')
                }
            }
        }

        // R4 criterion 2, extended: check the **merged** manifest too, not just source.
        //
        // The source check above only proves we did not type a permission ourselves. A
        // library can merge one in, and that is the realistic way the offline promise
        // gets broken: add a dependency, it merges INTERNET, nobody notices. Requirement
        // 4 criterion 12 does this for the dependency denylist but nothing did it for
        // permissions.
        //
        // Exempted: AndroidX injects a signature-level, self-scoped permission for
        // registering non-exported receivers. It grants no device access at all — it can
        // only ever be held by an app signed with our own key.
        def permissionAllowlist = [~/.*\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$/]
        ['app'].each { module ->
            // Every merged manifest, not the first one found. With product flavours there is
            // one per variant, and `.find` would have vouched for a single arbitrary variant
            // while saying nothing about the others — a flavour could have grown a permission
            // and this check would still have reported PASS.
            def merged = fileTree("$module/build") {
                include '**/merged_manifest*/**/AndroidManifest.xml'
                include '**/manifest*/**/AndroidManifest.xml'
            }.files.findAll { it.exists() }

            if (merged.isEmpty()) {
                // In fast mode a missing manifest is expected, not a violation — the hook is
                // not going to run assembleDebug. The full `check` still catches it.
                if (fast) return
                note('R4-merged-permissions',
                        "no merged manifest found for :$module — run assembleDebug first, " +
                                'this check cannot vouch for the installed permission set',
                        'Requirement 4 criterion 2')
                return
            }
            merged.each { manifest ->
                (manifest.text =~ /uses-permission[^>]*android:name="([^"]+)"/).each { m ->
                    def name = m[1]
                    if (permissionAllowlist.any { name ==~ it }) return
                    note('R4-merged-permissions',
                            "merged manifest ${rootProject.relativePath(manifest)} grants $name",
                            'Requirement 4 criterion 2')
                }
            }
        }

        // R4 criterion 4: no raster image or audio payload. Fonts and XML are exempt
        // (criterion 13) — the launcher icons are XML vectors and must not trip this.
        def binaryExt = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp', 'heic', 'heif', 'tif',
                         'tiff', 'ico', 'psd', 'mp3', 'wav', 'ogg', 'oga', 'm4a', 'aac',
                         'flac', 'opus', 'mid', 'midi', 'wma', '3gp']
        // Every res/ and assets/ directory under every source set, not just src/main.
        // A per-flavour drawable — a raster the studio build shows but the standalone
        // does not — would have sailed through a src/main-only scan while shipping in
        // the studio APK.
        ['app', 'design-system'].each { module ->
            def srcRoot = file("$module/src")
            if (!srcRoot.exists()) return
            srcRoot.eachFileRecurse { f ->
                if (!f.isFile()) return
                def rel = rootProject.relativePath(f).replace(File.separator, '/')
                if (!(rel =~ /\\/(res|assets)\\//)) return
                def ext = f.name.tokenize('.').last().toLowerCase()
                if (ext in binaryExt) {
                    note('R4-no-binary-assets', "$rel ($ext)",
                            'Requirement 4 criteria 4 and 13')
                }
            }
        }

        // P15, made checkable: colour resources are defined in exactly one file — the
        // design system's colours.xml — plus one documented, allowlisted exception. The
        // launch window background is the one colour the platform needs before any
        // Compose code exists, so app/src/main's pair mirrors tokens.json `bg` by hand
        // and says so in its own header. Anything else defining `<color name=…>` is the
        // drift that shipped once: four prototype colours whose values disagreed with
        // the canon. A new colour belongs in the design system file, mirroring a token.
        def colourXmlAllowlist = [
                'design-system/src/main/res/values/colors.xml',
                'app/src/main/res/values/colors.xml',
                'app/src/main/res/values-night/colors.xml',
        ]
        ['app', 'design-system'].each { module ->
            def srcRoot = file("$module/src")
            if (!srcRoot.exists()) return
            srcRoot.eachFileRecurse { f ->
                if (!f.isFile() || !f.name.endsWith('.xml')) return
                def rel = rootProject.relativePath(f).replace(File.separator, '/')
                if (!(rel =~ /\\/res\\/values/)) return
                if (!(f.text =~ /<color\\s+name=/)) return
                if (rel in colourXmlAllowlist) return
                note('P15-colour-resource',
                        "$rel defines colour resources — colours live only in " +
                                'design-system/src/main/res/values/colors.xml; the launch_background ' +
                                'pair in app/src/main is the one allowlisted exception',
                        'Requirement 15 · rules.md P15')
            }
        }

        // R4 criteria 3 and 11: nothing from the dependency denylist.
        def denylist = new File(canon, 'dependency-denylist.md')
        if (!denylist.exists()) {
            note('R4-denylist', 'design-canon/dependency-denylist.md is missing',
                    'Requirement 4 criterion 11')
        } else {
            // Entries are the back-ticked coordinates in the barred tables. The
            // permitted table is below a heading, so stop there.
            def barred = denylist.text.split(/## Permitted/)[0]
            def entries = (barred =~ /\|\s*`([a-z0-9.:_-]+)`\s*\|/).collect { it[1] }
            ['app/build.gradle', 'design-system/build.gradle'].each { script ->
                def s = file(script)
                if (!s.exists()) return
                s.readLines().eachWithIndex { line, i ->
                    def code = line.replaceAll(/\/\/.*$/, '')
                    entries.each { entry ->
                        if (code.contains(entry)) {
                            note('R4-denylist',
                                    "$script:${i + 1} declares barred coordinate $entry",
                                    'Requirement 4 criterion 3')
                        }
                    }
                }
            }
        }

        // R5 criteria 2 and 3: the canon component list and components/ must agree.
        def specs = new File(canon, 'component-specs.md')
        if (specs.exists()) {
            def declared = (specs.text =~ /(?m)^### `(\w+)`/).collect { it[1] } as Set
            def present = (dsComponents.exists()
                    ? dsComponents.listFiles().findAll { it.name.endsWith('.kt') }
                    : []).collectMany { f ->
                (f.text =~ /(?m)^(?:@Composable\s*\n)?fun (\w+)\(/).collect { it[1] }
            } as Set
            (declared - present).each { c ->
                note('R5-component-agreement', "specced but not implemented: $c",
                        'Requirement 5 criterion 2')
            }
        }

        // X5: every canon and ideas document carries a status marker.
        //
        // rules.md claimed this was enforced. It was not. The marker is how a reader knows
        // whether a document describes working code or an intention, which matters most to
        // whoever trusts it least.
        ['design-canon', 'ideas'].each { dir ->
            def d = new File(workspace, dir)
            if (!d.isDirectory()) return
            d.listFiles()?.each { doc ->
                if (!doc.name.endsWith('.md')) return
                if (!(doc.text =~ /(?m)^status:\s*\S+/)) {
                    note('X5-status-markers', "$dir/${doc.name} declares no status marker",
                            'Requirement 5, rules.md X5')
                }
            }
        }

        // M5 and M3: the registry and the roadmap must agree, and only one game builds
        // at a time.
        //
        // Both were marked enforced and neither was. M5 is the one that matters: a game
        // that exists in code but not in the roadmap has skipped the admission criteria
        // entirely — the offline, no-assets, monochrome and generation-time thresholds that
        // decide what belongs in the catalog at all.
        def roadmap = new File(workspace, 'ideas/games-roadmap.md')
        // One registry per flavour, so this looks across every source set rather than at a
        // single hardcoded path. A flavour that registers an unlisted game is the exact case
        // this catches, and it is easier to reach now that there are two registries to keep
        // in step.
        def registries = appSources.collectMany { ktFiles(it) }
                .findAll { it.name == 'GameRegistry.kt' }
        if (roadmap.exists()) {
            if (registries.isEmpty()) {
                note('M5-roadmap-agreement',
                        'no GameRegistry.kt found in any app source set',
                        'Requirement 5, rules.md M5')
            }
            def roadmapText = roadmap.text.toLowerCase()
            registries.each { registry ->
                (registry.text =~ /(\w+)Definition\s*\(\s*\)/).each { m ->
                    def id = m[1].toLowerCase()
                    if (!roadmapText.contains(id)) {
                        note('M5-roadmap-agreement',
                                "${rootProject.relativePath(registry)} registers '$id', " +
                                        'which games-roadmap.md does not list',
                                'Requirement 5, rules.md M5')
                    }
                }
            }
            def inProgress = (roadmap.text =~ /status\s*`in_progress`/).count
            if (inProgress > 1) {
                note('M3-one-in-progress',
                        "games-roadmap.md marks $inProgress games in_progress; the limit is one",
                        'Requirement 7, rules.md M3')
            }
        }

        // R4: the GPL-3.0 generator stays out of the shared source set.
        //
        // This is the licensing half of the flavour split, and the reason it is worth doing
        // at all. GPL-3.0 attaches to whatever artifact ships the code, so an engine sitting
        // in `src/main` is linked into *every* flavour — including future games that contain
        // no GPL code and would inherit the obligation for nothing. Scoped to
        // `src/gameSudoku`, only Sudoku-bearing flavours carry it.
        //
        // Checked by package path rather than by licence header, because moving the files
        // back is the mistake that would actually happen.
        def sharedAppJava = new File(appSrc, 'main/java')
        if (sharedAppJava.exists()) {
            ktFiles(sharedAppJava).each { f ->
                if (f.path.replace(File.separator, '/') =~ /\/sudoku\/core\//) {
                    note('R4-gpl-isolation',
                            "${rootProject.relativePath(f)} puts GPL-3.0 vendored code in the " +
                                    'shared source set, so every flavour links it',
                            'Requirement 4, resource-map.md')
                }
            }
        }

        // The other half of the same rule, generalized: src/main is the *shell* source set.
        //
        // R4-gpl-isolation catches the engine; this catches any game's UI or state code by
        // package path. Game code in src/main is linked into every flavour, so a flavour that
        // does not ship a game still carries it — and a new game could grow in the shared set,
        // skipping admission in every flavour at once. Games live in src/game<Name>/java and
        // are attached to flavours one srcDirs line at a time (D25). Shell code is what
        // belongs in src/main: MainActivity, studio/, core/GameDefinition, persistence.
        if (sharedAppJava.exists()) {
            ktFiles(sharedAppJava).each { f ->
                def rel = f.path.replace(File.separator, '/')
                if (rel =~ /\/com\/example\/lightapp\/(games|sudoku)\//) {
                    note('G2-pure-main',
                            "${rootProject.relativePath(f)} puts game code in the shared source set",
                            'D25 flavour split — game code belongs in src/game<Name>/java')
                }
            }
        }

        // M5, extended to the flavour split: the admission chain must agree per flavour.
        //
        // For each game directory (src/game<Name>), three statements must hold at once:
        //   1. the directory exists,
        //   2. some flavour's srcDirs line in app/build.gradle attaches it,
        //   3. that flavour's GameRegistry registers <Name>Definition().
        // A game dir no flavour attaches is unreachable code carrying its licence obligations
        // for nothing; a srcDirs line without a registration ships a game that skipped the
        // roadmap admission criteria; a registration without a srcDirs line cannot compile.
        // Each direction drifted once before this existed, which is why all three are checked.
        def buildScript = file('app/build.gradle')
        if (buildScript.exists()) {
            def buildText = buildScript.text
            def gameDirs = [] as Set
            def gameSrcRoot = file('app/src')
            if (gameSrcRoot.exists()) {
                gameSrcRoot.listFiles()?.each { d ->
                    if (d.isDirectory() && d.name.startsWith('game')) gameDirs << d.name
                }
            }
            gameDirs.sort().each { gameDir ->
                def game = gameDir.substring('game'.length())
                def attached = []
                (buildText =~ /(\w+)\s*\{\s*java\.srcDirs\s*\+=\s*\[([^\]]*)\]/).each { m ->
                    if (m[2].contains(gameDir)) attached << m[1]
                }
                if (attached.isEmpty()) {
                    note('M5-flavour-agreement',
                            "app/src/$gameDir exists but no flavour attaches it via srcDirs — " +
                                    'its code compiles nowhere',
                            'Requirement 5, rules.md M5, decision D25')
                    return
                }
                attached.each { flavour ->
                    def registry = ktFiles(file("app/src/$flavour/java"))
                            .find { it.name == 'GameRegistry.kt' }
                    if (registry == null) {
                        note('M5-flavour-agreement',
                                "$gameDir is attached to flavour '$flavour', which has no " +
                                        'GameRegistry.kt',
                                'Requirement 5, rules.md M5')
                        return
                    }
                    // Same comment-stripping as the reverse direction: a commented-out
                    // registration must not count as a present one. Per-line, because
                    // `$` without (?m) anchors at the end of the whole text, not each line.
                    if (!(registry.readLines().collect { it.replaceAll(/\/\/.*$/, '') }
                            .join('\n') =~ /${game}Definition\s*\(/)) {
                        note('M5-flavour-agreement',
                                "$gameDir is attached to flavour '$flavour', whose registry does " +
                                        "not register ${game}Definition()",
                                'Requirement 5, rules.md M5')
                    }
                }
            }
            // And the reverse direction: a registration whose game dir is missing, or whose
            // flavour's srcDirs line does not attach it, is caught here with a fix that names
            // the exact line to add.
            registries.each { registry ->
                def flavourDir = registry.path.replace(File.separator, '/')
                        .split('/src/')[1].split('/')[0]
                // Comments are not registrations. GameRegistry.kt carries a
                // `// MinesweeperDefinition(), ← add when ready` onboarding line; matching
                // raw text made the comment a binding statement of admission. Per-line
                // stripping — `$` without (?m) anchors at the end of the whole text.
                def registryCode = registry.readLines()
                        .collect { it.replaceAll(/\/\/.*$/, '') }.join('\n')
                (registryCode =~ /(\w+)Definition\s*\(\s*\)/).each { m ->
                    // .toString(): the interpolation yields a GString, and GString never
                    // equals String — so Set.contains silently missed every lookup.
                    def gameDir = "game${m[1]}".toString()
                    if (!gameDirs.contains(gameDir)) {
                        note('M5-flavour-agreement',
                                "${rootProject.relativePath(registry)} registers ${m[1]}Definition() " +
                                        "but app/src/$gameDir does not exist",
                                'Requirement 5, rules.md M5')
                    } else if (!(buildText =~ /$flavourDir\s*\{[^}]*$gameDir/)) {
                        note('M5-flavour-agreement',
                                "${rootProject.relativePath(registry)} registers ${m[1]}Definition() " +
                                        "but the '$flavourDir' srcDirs line does not attach src/$gameDir",
                                'Requirement 5, rules.md M5, decision D25')
                    }
                }
            }

            // M5: a flavour that ships games must be a complete, installable app.
            //
            // The studio flavour carries the base applicationId; every other shipped flavour
            // needs its own applicationIdSuffix or it installs as a second copy of the same
            // app, silently replacing it on the device. A GameRegistry in a flavour source set
            // is the marker that the flavour is meant to ship, so that is the trigger.
            registries.each { registry ->
                def flavour = registry.path.replace(File.separator, '/')
                        .split('/src/')[1].split('/')[0]
                if (flavour == 'main') return
                def block = (buildText =~ /(?ms)^\s*$flavour\s*\{(.{0,400}?)^\s*\}/)
                if (!block.find()) {
                    note('M5-standalone-identity',
                            "flavour '$flavour' has a GameRegistry but no productFlavors block",
                            'Requirement 5, rules.md M5')
                } else if (flavour != 'studio' && !(block[0][1] =~ /applicationIdSuffix/)) {
                    note('M5-standalone-identity',
                            "flavour '$flavour' ships games but declares no applicationIdSuffix — " +
                                    'it would install over the studio app',
                            'Requirement 5, rules.md M5, decision D27')
                }
            }
        }

        // R16: a release build that references a missing ProGuard file cannot be produced.
        //
        // `minifyEnabled true` plus `proguardFiles … 'proguard-rules.pro'` with no such file
        // meant `bundleRelease` — the command AGENTS.md documents for shipping — had never
        // been able to run. Nothing caught it because nobody ran the release path.
        def appGradle = file('app/build.gradle')
        if (appGradle.exists() && appGradle.text.contains('minifyEnabled true')) {
            (appGradle.text =~ /proguardFiles[^\n]*'([^']+\.pro)'/).each { m ->
                if (!file("app/${m[1]}").exists()) {
                    note('R16-release-proguard',
                            "app/build.gradle references app/${m[1]}, which does not exist — " +
                                    'bundleRelease cannot succeed',
                            'Requirement 16')
                }
            }
        }

        // R16: persistence must survive a damaged file.
        //
        // The store is read during composition and in a ViewModel init, neither of which can
        // catch. Without a corruption handler an unreadable preferences file is a crash at
        // launch that the user can only escape by clearing app data.
        appSources.collectMany { ktFiles(it) }.each { f ->
            if (f.text =~ /preferencesDataStore\s*\(/ && !(f.text.contains('corruptionHandler'))) {
                note('R16-datastore-corruption',
                        "${rootProject.relativePath(f)} creates a DataStore with no corruptionHandler",
                        'Requirement 16 criterion 9')
            }
        }

        // R17 criteria 8 and 9: values restated in AGENTS.md must match tokens.json.
        def tokensFile = new File(canon, 'tokens.json')
        def agents = new File(workspace, 'AGENTS.md')
        def knownHex = tokensFile.exists()
                ? (tokensFile.text =~ /"(#[0-9A-Fa-f]{6})"/).collect { it[1].toUpperCase() } as Set
                : null

        if (knownHex != null && agents.exists()) {
            (agents.text =~ /`(#[0-9A-Fa-f]{6})`/).each { m ->
                def hex = m[1].toUpperCase()
                if (!(hex in knownHex)) {
                    note('R17-agents-token-drift',
                            "AGENTS.md states $hex, which tokens.json does not define",
                            'Requirement 17 criterion 9')
                }
            }
        }

        // Same rule, extended to the canon documents whose job is to *state* values.
        //
        // R17-agents-token-drift only ever guarded AGENTS.md, which left the canon itself
        // free to drift — and it had. `nothing-tokens.md` documented a success green, a
        // warning amber and an interactive blue, and `nothing-design-system.md` granted
        // them an explicit exemption from the one-accent rule. None of the four existed in
        // tokens.json, and all of them contradict the palette rule in `ideas/avoid.md`.
        //
        // That mattered more than a stale doc normally would, because
        // `nothing-design-system.md` is symlinked as .claude/skills/nothing-design/SKILL.md
        // — an agent asked for "Nothing design" was being handed the contradictory version
        // as authoritative.
        //
        // Scoped to these two files deliberately. `rationale.md` must be able to name
        // values it *rejected* — it discusses raising accentRed to #FF4D57 to reach 5.80:1
        // and explains why that was refused — and `nothing-study.md` cites Nothing's own
        // published colours. Neither is telling anyone what to use. `ideas/` is exempt by
        // its own charter: it is thinking, explicitly not a source of values.
        ['nothing-tokens.md', 'nothing-design-system.md'].each { name ->
            def doc = new File(canon, name)
            if (knownHex == null || !doc.exists()) return
            doc.readLines().eachWithIndex { line, i ->
                (line =~ /(#[0-9A-Fa-f]{6})/).each { m ->
                    def hex = m[1].toUpperCase()
                    if (!(hex in knownHex)) {
                        note('R17-canon-token-drift',
                                "design-canon/$name:${i + 1} states $hex, " +
                                        'which tokens.json does not define',
                                'Requirement 17 criteria 8 and 9')
                    }
                }
            }
        }

        def violations = []
        def suppressed = 0

        rules.each { rule ->
            rule.roots.each { root ->
                ktFiles(root).each { f ->
                    f.readLines().eachWithIndex { line, i ->
                        // Comments and doc are not code. Every rule in this file is about
                        // what the compiler sees.
                        def code = line.replaceAll(/\/\/.*$/, '').replaceAll(/^\s*\*.*$/, '')
                        if (!(code =~ rule.pattern)) return
                        // The per-rule exemption. This was a declared field that nothing ever
                        // called, so every `exempt` closure written against it was dead — a
                        // rule that looked scoped and was not. Wired here.
                        if (rule.exempt(f, code)) return
                        if (code.contains(SUPPRESSION) || f.text.contains(SUPPRESSION + '(')) {
                            suppressed++
                            return
                        }
                        violations << [
                                rule: rule,
                                file: rootProject.relativePath(f),
                                line: i + 1,
                                text: line.trim(),
                        ]
                    }
                }
            }
        }

        // X11: the suppression cap is applied, not merely printed.
        //
        // It used to be printed and never applied, which made it a suggestion. A cap that does
        // not fail the build is how a system with ten escape hatches becomes one with fifty —
        // each suppression is individually reasonable and the aggregate is not. Counted here,
        // before the report is written, so the printed detail and the failure count agree.
        if (suppressed > SUPPRESSION_CAP) {
            note('X11-suppression-cap',
                    "$suppressed suppressed occurrence(s) exceeds the cap of $SUPPRESSION_CAP",
                    'Requirement 15 criterion 15')
        }

        // Structural check: proprietary font files must not exist at all.
        ['app', 'design-system'].each { module ->
            def fontDir = file("$module/src/main/res/font")
            if (fontDir.exists()) {
                fontDir.listFiles().each { f ->
                    if (f.name =~ /(ndot|ntype)/) {
                        violations << [
                                rule: rules.find { it.id == 'R9-proprietary-fonts' },
                                file: rootProject.relativePath(f),
                                line: 0,
                                text: 'proprietary font file present in the project',
                        ]
                    }
                }
            }
        }

        println ''
        println '─'.multiply(72)
        println 'CONFORMANCE CHECK'
        println '─'.multiply(72)

        def byRule = violations.groupBy { it.rule.id }
        rules.each { rule ->
            def hits = byRule[rule.id] ?: []
            def status = hits.isEmpty() ? 'PASS' : "FAIL (${hits.size()})"
            printf('  %-26s %s%n', rule.id, status)
            hits.each { v ->
                printf('      %s:%d%n', v.file, v.line)
                printf('        %s%n', v.text)
                printf('        %s — %s%n', rule.description, rule.authority)
                if (rule.fix) printf('        FIX: %s%n', rule.fix)
            }
        }

        // ── structural results ────────────────────────────────────────────────
        def structuralIds = [
                'R1-harness-dirs'        : 'Four harness directories exist',
                'R1-root-markdown'       : 'Root markdown limited to README, AGENTS, CLAUDE',
                'R17-adapter-links'      : 'Agent adapters are symlinks, never copies',
                'R4-zero-permissions'    : 'No Android permission declared in source',
                'R4-merged-permissions'  : 'No permission in the merged manifest either',
                'R4-no-package-attr'     : 'No deprecated manifest package attribute',
                'R4-no-binary-assets'    : 'No raster image or audio payload',
                'R4-denylist'            : 'No barred dependency coordinate',
                'R5-component-agreement' : 'Canon component list matches components/',
                'R17-agents-token-drift' : 'AGENTS.md restates only real token values',
                'R17-canon-token-drift'  : 'Value-stating canon docs name only real tokens',
                'X5-status-markers'      : 'Every canon and ideas document states its status',
                'M5-roadmap-agreement'   : 'Every registered game appears in the roadmap',
                'M3-one-in-progress'     : 'At most one game in_progress at a time',
                'R16-release-proguard'   : 'A referenced ProGuard file exists',
                'R16-datastore-corruption': 'DataStore is created with a corruption handler',
                'X11-suppression-cap'    : 'Suppressions stay within the cap of ten',
                'R4-gpl-isolation'       : 'GPL-3.0 vendored code stays out of the shared source set',
                'R4-allow-backup'        : 'Every manifest pins android:allowBackup="false"',
                'G2-pure-main'           : 'src/main holds shell code only, never game code',
                'M5-flavour-agreement'   : 'Game dir, srcDirs line, and registry agree per flavour',
                'M5-standalone-identity' : 'Every shipped flavour owns its own application id',
        ]
        // The remedy for each structural rule, same purpose as ConformanceRule.fix: turn a
        // failure into an instruction a small model can act on without reading the authority.
        def structuralFix = [
                'R1-harness-dirs'        : 'Recreate the missing top-level directory (ideas, ' +
                        'design-canon, projects, or specs).',
                'R1-root-markdown'       : 'Move the file out of the repo root. Only README.md, ' +
                        'AGENTS.md, and CLAUDE.md may live there; docs go under design-canon/ or ideas/.',
                'R17-adapter-links'      : 'Make it a symlink to AGENTS.md, not a copy: ' +
                        'from the repo root, ln -sf AGENTS.md CLAUDE.md (and likewise for the copilot file).',
                'R4-zero-permissions'    : 'Delete the <uses-permission> line. The app declares zero ' +
                        'permissions — see ideas/avoid.md.',
                'R4-merged-permissions'  : 'A dependency merged a permission in. Remove that dependency. ' +
                        'If the message says "no merged manifest", run assembleDebug first.',
                'R4-no-package-attr'     : 'Remove package="..." from the manifest; the id comes from ' +
                        'the namespace in build.gradle.',
                'R4-no-binary-assets'    : 'Delete the image/audio file. Draw it with Compose shapes or ' +
                        'Canvas, or use the dot-matrix GameIcon.',
                'R4-denylist'            : 'Remove the barred dependency. See ' +
                        'design-canon/dependency-denylist.md for what is permitted.',
                'R5-component-agreement' : 'Either implement it as `fun <Name>(` in ' +
                        'design-system/.../components, or delete its `### `<Name>`` heading from ' +
                        'component-specs.md. The spec and the code must match.',
                'R17-agents-token-drift' : 'The hex value is not in tokens.json. State a token name ' +
                        'instead, or add the token to tokens.json first.',
                'R17-canon-token-drift'  : 'The hex value is not in tokens.json. Remove it or add the ' +
                        'token. These docs may only name values that exist.',
                'X5-status-markers'      : 'Add a YAML front-matter block at the very top of the ' +
                        'file: a line with three dashes, then `status: canonical` (or draft / ' +
                        'superseded), then another three-dash line. Copy the top of any other canon doc.',
                'M5-roadmap-agreement'   : 'Add the game to ideas/games-roadmap.md section 4, or remove ' +
                        'its Definition() from GameRegistry. A game must pass admission before it ships.',
                'M3-one-in-progress'     : 'Set all but one game to a status other than in_progress in ' +
                        'games-roadmap.md. Ship one, then start the next.',
                'R16-release-proguard'   : 'Create the referenced file (app/proguard-rules.pro). It may ' +
                        'be nearly empty; see the existing one for the minimum.',
                'R16-datastore-corruption': 'Add corruptionHandler = ReplaceFileCorruptionHandler ' +
                        '{ emptyPreferences() } to the preferencesDataStore delegate. A damaged file must ' +
                        'not crash launch.',
                'X11-suppression-cap'    : 'Remove @DesignSuppression annotations until at most ten ' +
                        'remain. Fix the underlying violation rather than suppressing it.',
                'R4-gpl-isolation'       : 'Move the file out of src/main/java into a ' +
                        'src/game<Name>/java source set, so only flavours that ship that game link the ' +
                        'GPL engine.',
                'R4-allow-backup'        : 'Add android:allowBackup="false" to the <application> ' +
                        "element in that manifest. Absent means true, and device transfer can lift " +
                        'the app\'s private DataStore off the device.',
                'G2-pure-main'           : 'Move the file into the game\'s own source set ' +
                        '(src/game<Name>/java/...) and attach it to flavours with a srcDirs line in ' +
                        'app/build.gradle. src/main is the shell: MainActivity, studio/, core/, ' +
                        'persistence.',
                'M5-flavour-agreement'   : 'Make the three statements agree: app/src/game<Name>/ ' +
                        'exists, a flavour block in app/build.gradle reads ' +
                        "java.srcDirs += ['src/game<Name>/java'], and that flavour's GameRegistry " +
                        'registers <Name>Definition(). A game must pass roadmap admission (M5) ' +
                        'before it ships.',
                'M5-standalone-identity' : "Add applicationIdSuffix '.<flavour>' to the flavour block " +
                        'in app/build.gradle. Each shipped app needs its own id or it installs over ' +
                        'another — see decision D27.',
        ]

        def byStructural = structural.groupBy { it.id }
        structuralIds.each { id, description ->
            def hits = byStructural[id] ?: []
            printf('  %-26s %s%n', id, hits.isEmpty() ? 'PASS' : "FAIL (${hits.size()})")
            hits.each { h ->
                printf('      %s%n', h.detail)
                printf('        %s — %s%n', description, h.authority)
                if (structuralFix[id]) printf('        FIX: %s%n', structuralFix[id])
            }
        }

        println '─'.multiply(72)
        if (suppressed > 0) {
            println "  ${suppressed} suppressed occurrence(s) — cap is ${SUPPRESSION_CAP}, " +
                    'Requirement 15 criterion 15'
        }

        def total = violations.size() + structural.size()
        def ruleCount = rules.size() + structuralIds.size()

        if (total == 0) {
            println "  ${ruleCount} rules, 0 violations"
            println '─'.multiply(72)
        } else {
            println "  ${total} violation(s) across ${byRule.size() + byStructural.size()} rule(s)"
            println '─'.multiply(72)
            throw new GradleException(
                    "Conformance check failed with ${total} violation(s). " +
                            'See design-canon/rules.md for the full rule index.')
        }
    }
}

// ── Android Lint is disabled, and this is a real gap ──────────────────────────
//
// AGP 8.5.2's bundled Lint cannot run on JDK 25 — it fails parsing the version
// string, the same family of problem as the Kotlin 1.9 daemon in D22. Every
// lintAnalyze task dies, which takes `check` down with it.
//
// So Lint is off until AGP is upgraded. What that costs us: Lint's accessibility
// checks, API-level checks, and resource validation. The conformance checker below
// covers our own design rules but is no substitute for those.
//
// This is the last known toolchain casualty of JDK 25. Upgrading AGP is the fix.
gradle.projectsEvaluated {
    subprojects.each { sub ->
        sub.tasks.matching { it.name.startsWith('lint') }.configureEach { enabled = false }
    }
}

// A build gate, not an optional step. The forbidden-type rule is enforcement rather
// than impossibility (see rationale.md §9), so it only works if it actually runs.
//
// Wired eagerly on purpose: a lazy `configureEach` callback here never fires, because
// the module `check` tasks are already realised by the time this script is applied.
// That silently produced a checker that passed because it was not running at all —
// which is exactly the failure mode this whole enforcement ladder exists to avoid.
// Wired from each module's build.gradle rather than from here, because AGP registers
// `check` lazily and neither a `configureEach` callback nor an eager `findByName`
// inside `projectsEvaluated` reliably catches it. That silently produced a checker
// which "passed" because it was never running — exactly the failure mode this whole
// enforcement ladder exists to prevent, and worth the extra two lines to avoid.
//
// See the `tasks.named('check')` block in app/build.gradle and
// design-system/build.gradle.
