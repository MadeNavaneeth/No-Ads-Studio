# ═══════════════════════════════════════════════════════════════════════════
# Tuned for the reference machine: 2-core, 8 GB MacBook Air.
# See ideas/avoid.md — build cost on this hardware is a design constraint.
# ═══════════════════════════════════════════════════════════════════════════

# Gradle daemon. 2 GB leaves headroom for the Kotlin daemon alongside it on 8 GB.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# The Kotlin daemon needs its own explicit heap. Without this it inherits a default
# that is too small here, dies mid-compile with "Daemon compilation failed: null",
# and Gradle silently falls back to non-incremental compilation — which is why a
# clean build was taking minutes longer than it needed to.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# Reuse task outputs across builds. Meaningful win on repeated builds.
org.gradle.caching=true

# Only run tasks whose inputs changed.
org.gradle.configureondemand=true

# Left OFF deliberately: with 2 cores, parallel execution costs more in memory
# contention than it recovers in wall time.
# org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35

# android.enableJetifier removed: it rewrites legacy support-library bytecode, and
# this project depends on none. It was pure build-time overhead.
