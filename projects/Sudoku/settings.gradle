pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.5.2' apply false
        id 'com.android.library' version '8.5.2' apply false
        // Kotlin 2.2.21: 1.9.25's compile daemon cannot start on JDK 25, so every
        // compile was falling back to non-incremental. Gradle 9.3 itself embeds
        // 2.2.21, which is the evidence this version runs on JDK 25.
        // From Kotlin 2.0 the Compose compiler is its own plugin, versioned in
        // lockstep with Kotlin.
        id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
        id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "LightApp"
include ':app'
include ':design-system'
