// D37: standalone binairo(10) app — root build.
plugins {
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.android' apply false
    id 'org.jetbrains.kotlin.plugin.compose' apply false
}


// AGP 8.5.2's bundled Lint cannot run on JDK 25 (D22/D24) — every lintAnalyze dies and
// takes check down with it. Disabled until the AGP upgrade; the conformance gate covers
// our own rules, and Lint's accessibility/API checks remain the documented gap.
tasks.matching { it.name.startsWith('lint') }.configureEach { enabled = false }
