pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    versionCatalogs {
        libs { from(files(new File(settingsDir, '../../gradle/libs.versions.toml'))) }
    }
    repositories {
        google()
        mavenCentral()
    }
}
// D35: design-system is now its own build under projects/ so every game project can
// include it via Gradle composite builds (`includeBuild('../../design-system')`) and
// consume it as the module `com.example.lightapp:design-system` — one source tree,
// no published artifact, no copied tokens.
rootProject.name = "design-system"
// D37: the repo-root conformance gate, bound to check in build.gradle.
includeBuild('../../conformance')
