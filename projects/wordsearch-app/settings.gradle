// D35: standalone wordsearch(12) app — a self-contained Android project.
//
// Includes the shared design-system and shell as composite builds so this project
// compiles the same source as every other game. The shell provides the chrome
// (home/stats/settings/rules + navigation); this project provides the game itself.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    versionCatalogs {
        libs { from(files(new File(settingsDir, '../../gradle/libs.versions.toml'))) }
    }
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "wordsearch-app"
include ':app'

// Composite builds: the design system and the shared shell.
includeBuild('../design-system')
includeBuild('../shell')
includeBuild('../../conformance')  // D37: the repo-root conformance gate.
